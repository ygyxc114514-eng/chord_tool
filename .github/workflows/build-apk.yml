# 自动打包安卓 APK 的脚本（GitHub Actions）
# 触发方式：
#   1. 每次往 main 或 master 分支上传/修改文件，自动跑；
#   2. 也可以到仓库网页的 Actions 页手动点 "Run workflow" 跑。
# 构建机是 GitHub 免费提供的国外 Linux 服务器，下载安卓 SDK/NDK 不会卡。
# 签名用仓库根目录里固定的 debug.keystore（2026-09-16 起）：每次构建签名一致，
# 手机上升级可直接覆盖安装，不用先卸载。

name: 打包安卓 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 1/6 取代码
        uses: actions/checkout@v4

      - name: 2/6 装 Java 17（安卓打包必需，系统自带的版本太旧）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3/6 装系统依赖
        # automake/libltdl-dev：编译 CPython 的 configure 要用 libtool 的 ltdl 宏，
        # 缺了会报 "possibly undefined macro: LT_SYS_SYMBOL_USCORE"（首跑实测）
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: 4/6 装 buildozer（打包工具）
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer

      - name: 5/6 恢复缓存（安卓 SDK/NDK）
        # 缓存只为省下载时间（SDK/NDK 体积大）。
        # 签名不再靠它：曾把 ~/.android 一起缓存，实测三版 APK 的签名证书仍各不相同
        # （缓存兜不住 AGP 实际使用的签名文件），所以改成 5.5 步用仓库里固定的 keystore。
        # restore/save 分开的写法：restore-keys 还能吃到改名前的老缓存。
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: 5.5/6 固定调试签名（把仓库里的 debug.keystore 放到构建机）
        # 构建机每次都是全新一台，AGP 自动生成的调试签名每次都不一样，
        # 手机覆盖安装会报"应用未安装"。仓库根目录里这份 debug.keystore 是调试签名
        # 专用文件（口令是安卓约定俗成的 android，不含任何隐私），拷到 AGP 默认读取的位置。
        run: |
          set -e
          echo "HOME=$HOME"
          echo "USER=$(whoami)"
          echo "ANDROID_SDK_HOME=[$ANDROID_SDK_HOME] ANDROID_USER_HOME=[$ANDROID_USER_HOME]"
          echo "== 恢复缓存后 ~/.android 内容（诊断）："
          ls -la ~/.android 2>&1 || true
          echo "== 构建机上现成的 debug.keystore（诊断）："
          find /home/runner /usr/local/lib/android -name debug.keystore 2>/dev/null || true
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          if [ -n "$ANDROID_SDK_HOME" ]; then mkdir -p "$ANDROID_SDK_HOME/.android"; cp debug.keystore "$ANDROID_SDK_HOME/.android/debug.keystore"; fi
          if [ -n "$ANDROID_USER_HOME" ]; then mkdir -p "$ANDROID_USER_HOME"; cp debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi
          ls -la ~/.android/debug.keystore
          echo "== 放置后校验（仓库 vs 构建机）："
          sha256sum debug.keystore ~/.android/debug.keystore
          cp ~/.android/debug.keystore /tmp/keystore_before_build

      - name: 6/6 构建 APK
        # charset-normalizer 3.5 起在 PyPI 上带安卓专用 wheel，p4a 解析依赖时会选中它，
        # 但最后安装那一步不带平台参数，pip 拒装安卓 wheel（构建 #3 实测报
        # "charset_normalizer ... is not a supported wheel on this platform"）。
        # 约束到 3.5 以下（只有 py3-none-any 通用包，本机复刻验证过），绕开这个问题。
        run: |
          echo "charset-normalizer<3.5" > /tmp/pip-constraints.txt
          PIP_CONSTRAINT=/tmp/pip-constraints.txt buildozer -v android debug

      - name: 6.4/6 核验签名指纹（和仓库里的 keystore 对不上就自动重签）
        # 这一步把关键证据打进日志（两侧指纹、全盘 find 到的 debug.keystore、
        # 构建前 keystore 哈希），并写一份到 job 摘要。
        # 若 AGP 没有用仓库里的 keystore（指纹对不上），就用 apksigner 以仓库
        # keystore 重新签名，保证产物证书始终固定；重签后再次核验，仍不过才失败。
        run: |
          exec 2>&1
          echo "== 环境 =="
          echo "HOME=$HOME"
          echo "== 构建后机器上所有 debug.keystore（诊断，含指纹与时间）："
          timeout 90 find / -name debug.keystore -not -path "/proc/*" 2>/dev/null | while read -r f; do echo "$f | $(sha256sum "$f" 2>/dev/null | awk '{print $1}') | $(stat -c %y "$f" 2>/dev/null)"; done || true
          echo "== 仓库 keystore vs 构建前拷贝 =="
          sha256sum debug.keystore 2>/dev/null || true
          sha256sum /tmp/keystore_before_build 2>/dev/null || true
          echo "== 产物 =="
          ls -la bin/ 2>/dev/null || true
          APK=$(ls bin/*.apk 2>/dev/null | head -1 || true)
          echo "APK=[$APK]"
          KT=$(command -v keytool 2>/dev/null || true)
          if [ -z "$KT" ] && [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/keytool" ]; then KT="$JAVA_HOME/bin/keytool"; fi
          echo "keytool=[$KT] JAVA_HOME=[$JAVA_HOME]"
          EXPECTED=""
          if [ -n "$KT" ]; then
            "$KT" -list -v -keystore debug.keystore -storepass android -alias androiddebugkey > /tmp/kt.txt 2>&1 || true
            head -40 /tmp/kt.txt
            EXPECTED=$(grep -i "sha256:" /tmp/kt.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z' || true)
          fi
          echo "期望证书指纹: [$EXPECTED]"
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk /usr/local/lib/android/sdk -name apksigner -type f 2>/dev/null | sort | tail -1 || true)
          ZIPALIGN=$(find ~/.buildozer/android/platform/android-sdk /usr/local/lib/android/sdk -name zipalign -type f 2>/dev/null | sort | tail -1 || true)
          echo "apksigner=[$APKSIGNER] zipalign=[$ZIPALIGN]"
          # 备用证书解析器（纯 python 读 APK v2 签名块），apksigner 不可用时兜底
          echo '' | base64 -d > /tmp/apkcert.py
          cert_of() {
            # 显示指定 apk 的签名证书 SHA-256（先 apksigner，失败则 python 解析 v2 块）
            local apk="$1"
            local got=""
            if [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --print-certs "$apk" > /tmp/as.txt 2>&1 || true
              got=$(grep -i "SHA-256 digest" /tmp/as.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z' || true)
            fi
            if [ -z "$got" ]; then
              got=$(python3 /tmp/apkcert.py "$apk" 2>/dev/null || true)
            fi
            echo "$got"
          }
          ACTUAL=""
          if [ -n "$APK" ]; then ACTUAL=$(cert_of "$APK" | tail -1); fi
          echo "实际证书指纹: [$ACTUAL]"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "== AGP 用的不是仓库里的 keystore，改用 apksigner 以仓库 keystore 重签 =="
            if [ -x "$APKSIGNER" ] && [ -n "$APK" ]; then
              if [ -x "$ZIPALIGN" ]; then
                "$ZIPALIGN" -f -p 4 "$APK" /tmp/aligned.apk || { echo "zipalign 失败"; exit 1; }
              else
                cp "$APK" /tmp/aligned.apk
              fi
              "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out /tmp/resigned.apk /tmp/aligned.apk || { echo "重签失败"; exit 1; }
              cp /tmp/resigned.apk "$APK"
              ACTUAL=$(cert_of "$APK" | tail -1)
              echo "重签后实际证书指纹: [$ACTUAL]"
            else
              echo "apksigner 不可用，无法重签"
            fi
          fi
          {
            echo "### 签名核验"
            echo ""
            echo "- keystore（仓库）sha256: $(sha256sum debug.keystore 2>/dev/null | awk '{print $1}')"
            echo "- keystore（构建机 ~/.android）sha256: $(sha256sum ~/.android/debug.keystore 2>/dev/null | awk '{print $1}')"
            echo "- 期望指纹: $EXPECTED"
            echo "- 最终实际指纹: $ACTUAL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "!! 签名不一致：见上方诊断"
            exit 1
          fi
          echo "签名核验通过：本次 APK 与仓库 keystore 一致，升级可覆盖安装"

      - name: 6.5/6 存回缓存（构建失败也存，下载过的东西下次直接用）
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}


      - name: 上传 APK 成品
        uses: actions/upload-artifact@v4
        # if: always()：即使 6.4 核验失败，也把 APK 传上来留作诊断材料
        if: always()
        with:
          name: chordtool-apk
          path: bin/*.apk
          if-no-files-found: error
