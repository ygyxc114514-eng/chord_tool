# 自动打包安卓 APK 的脚本（GitHub Actions）
# 触发方式：
#   1. 每次往 main 或 master 分支上传/修改文件，自动跑；
#   2. 也可以到仓库网页的 Actions 页手动点 "Run workflow" 跑。
# 构建机是 GitHub 免费提供的国外 Linux 服务器，下载安卓 SDK/NDK 不会卡。

name: 打包安卓 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 1/6 取代码
        uses: actions/checkout@v4

      - name: 2/6 装 Java 17（安卓打包必需，系统自带的版本太旧）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 3/6 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: 4/6 装 buildozer（打包工具）
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer

      - name: 5/6 缓存安卓 SDK/NDK（第一次构建慢，之后会快很多）
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: 6/6 构建 APK
        run: buildozer -v android debug

      - name: 上传 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: chordtool-apk
          path: bin/*.apk
          if-no-files-found: error
